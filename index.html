<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spracherkennung Diagnose</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:20px auto;padding:0 16px}
button{font-size:20px;padding:14px 18px;margin:6px}
#state{font-size:22px;font-weight:700;margin:18px 0}
#heard{font-size:28px;margin:16px 0;min-height:42px}
pre{white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:8px;min-height:180px}
</style>
</head>
<body>
<h1>Spracherkennung Diagnose</h1>
<p>Auf dem Samsung in <b>Google Chrome</b> testen.</p>

<button onclick="startTest('de-DE')">Deutsch testen</button>
<button onclick="startTest('es-ES')">Spanisch testen</button>
<button onclick="clearLog()">Log löschen</button>

<div id="state">Bereit</div>
<div id="heard"></div>
<pre id="log"></pre>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let timer = null;

function ts() {
  return new Date().toLocaleTimeString();
}
function log(msg) {
  const el = document.getElementById('log');
  el.textContent += `[${ts()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
function state(msg) {
  document.getElementById('state').textContent = msg;
  log(msg);
}
function clearLog() {
  document.getElementById('log').textContent = '';
  document.getElementById('heard').textContent = '';
  document.getElementById('state').textContent = 'Bereit';
}
function stopRec() {
  if (timer) { clearTimeout(timer); timer = null; }
  if (rec) {
    try { rec.stop(); } catch(e) {}
  }
}
function startTest(lang) {
  if (!SR) {
    state('SpeechRecognition wird von diesem Browser nicht unterstützt.');
    return;
  }

  stopRec();
  document.getElementById('heard').textContent = '';
  rec = new SR();
  rec.lang = lang;
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 10;

  log('--- Neuer Test: ' + lang + ' ---');

  rec.onstart = () => state('onstart – Erkennung gestartet');
  rec.onaudiostart = () => state('onaudiostart – Mikrofon liefert Audio');
  rec.onsoundstart = () => state('onsoundstart – Geräusch erkannt');
  rec.onspeechstart = () => state('onspeechstart – Sprache erkannt');

  rec.onresult = (e) => {
    const parts = [];
    for (let i = e.resultIndex; i < e.results.length; i++) {
      for (let j = 0; j < e.results[i].length; j++) {
        parts.push(e.results[i][j].transcript);
      }
    }
    const text = parts.join(' | ');
    document.getElementById('heard').textContent = 'Erkannt: ' + text;
    log('onresult: ' + text);
  };

  rec.onnomatch = () => state('onnomatch – Sprache gehört, aber nichts zugeordnet');
  rec.onerror = (e) => state('onerror: ' + e.error + (e.message ? ' – ' + e.message : ''));
  rec.onspeechend = () => state('onspeechend – Sprache beendet');
  rec.onsoundend = () => state('onsoundend – Geräusch beendet');
  rec.onaudioend = () => state('onaudioend – Audio beendet');
  rec.onend = () => state('onend – Erkennung beendet');

  try {
    rec.start();
    timer = setTimeout(() => {
      log('6-Sekunden-Limit erreicht → stop()');
      try { rec.stop(); } catch(e) {}
    }, 6000);
  } catch(e) {
    state('Startfehler: ' + e);
  }
}
</script>
</body>
</html>
